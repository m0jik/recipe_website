<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Shopping List</title>
        <link rel="stylesheet" href="/static/style.css">
    </head>
    <body>
        <header class="navbar">
            <div class="nav-left">
                <div class="logo">
                    <a href="/" style="color: rgb(255, 255, 255);">Jacob's Grub</a>
                </div>
            </div>
            <div class="nav-center">
                <form method="GET" action="/" class="search-form">
                    <input type="text" name="query" placeholder="Search recipes...">
                </form>
            </div>
            <div class="nav-right">
                {{ if .Username }}
                    <span class="welcome">Hello, {{ .Username }}</span>
                    <a href="/recipes/v1/new">Create Recipe</a>
                    <a href="/recipes/v1/myRecipe">My Recipes</a>
                    <a href="/shopping-list/v1">Shopping List</a>
                    <a href="/users/v1/logout">Logout</a>
                {{ else }}
                    <a href="/users/v1/login">Login</a>
                    <a href="/users/v1/register">Register</a>
                {{ end }}
            </div>
        </header>
        <main class="container">
            <section class="recipes">
                <h2>Shopping List</h2>
                <p>Your shopping list is empty.</p>
            </section>
        </main>
    </body>
</html>
