{{ define "cooking-mode-btn" }}
    <a style="margin-top: 0px" class="print-btn"
    href="/cooking-mode/v1?primary_name={{.PrimaryName}}&variant_name={{.VariantName}}&creatorID={{.CreatorID}}"
    title="Enter cooking mode">
        <img src="/static/icon/CookingMode.png" alt="">
    </a>
{{ end }}

{{ define "cooking-mode-recipe-btn" }}

       href="/cooking-mode/v1?primary_name={{.PrimaryName}}&variant_name={{.VariantName}}&creatorID={{.CreatorID}}">
        <span>Recipe</span>
    </a>
{{ end }}

{{ end }}
