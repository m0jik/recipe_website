<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Recipe</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="stylesheet" href="/static/style.css?v=max-time-filter-1">
</head>
<body>
    {{ template "navbar" .}}

<div class="card">
    <div class="card-header">
        <h2>New Recipe</h2>
    </div>

    <form id="recipe-form" action="/recipes/v1/new" method="POST" enctype="multipart/form-data">
        <div class="card-body">

            <div class="field">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" required
                       placeholder="e.g Chicken Pasta" value="{{ .Title }}">
            </div>

            <div class="field">
                <label for="myfile">Image</label>
                <input type="file" id="myfile" name="myfile"
                       accept="image/jpeg,image/png">
            </div>

            <div class="field">
                <label for="description">Description</label>
                <textarea id="description" name="description"
                          placeholder="Describe the dish (optional)">{{ .Description }}</textarea>
            </div>

            <div class="section-block">
                <div class="section-title">Tags</div>

                <div id="tags-list" class="item-list"></div>

                <div class="add-row">
                    <select id="recipe-tag" name="tag">
                        <option value="" disabled selected>Choose a tag</option>
                        {{range .PresetTagGroups}}
                            <optgroup label="{{.Name}}">
                                {{range .Tags}}<option value="{{.}}">{{.}}</option>{{end}}
                            </optgroup>
                        {{end}}
                    </select>

                    <button id="tag-add" type="button"
                            hx-get="/recipes/v1/tag-row"
                            hx-include="#recipe-tag"
                            hx-target="#tags-list"
                            hx-swap="beforeend"
                            class="btn-secondary">
                        + Add
                    </button>
                </div>
            </div>

            <div class="field">
                <label for="servings">Servings</label>
                <input type="number" id="servings" name="servings" min="1"
                       placeholder="e.g. 4" value="{{ .Servings }}">
            </div>

            <div class="field">
                <label for="prep_time_minutes">Prep time (minutes)</label>
                <input type="number" id="prep_time_minutes" name="prep_time_minutes" min="0"
                       placeholder="e.g. 30" value="{{ .PrepTime }}">
            </div>

        </div>

        <div class="card-footer">
            <button type="submit">Next</button>
        </div>
    </form>
</div>

</body>
</html>
