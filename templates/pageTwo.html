<!doctype html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>New Recipe - Step 2</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="stylesheet" href="/static/style.css?v=max-time-filter-1v=responsive-2">
</head>
<body>
    {{ template "nav" .}}
<div class="card">

    <div class="card-header">

        <img src="{{if .Image}}{{.Image}}{{else}}/static/placeholder.svg{{end}}"
             alt="Recipe image"
             class="recipe-preview-img">

        <h2>{{ .Title }}</h2>
        <p>Add ingredients and steps, then submit when ready</p>

    </div>

    <form method="POST" action="/recipes/v1/submit">

        <input type="hidden" name="title" value="{{ .Title }}">
        <input type="hidden" name="description" value="{{ .Description }}">
        <input type="hidden" name="image" value="{{ .Image }}">
        {{range .Tags}}<input type="hidden" name="tags" value="{{ . }}">{{end}}
        <input type="hidden" name="servings" value="{{ .Servings }}">
        <input type="hidden" name="prep_time_minutes" value="{{ .PrepTime }}">

        <div class="card-body">

            <!-- INGREDIENTS -->
            <div class="section-block">
                <div class="section-title">Ingredients</div>

                <div id="ingredients-list" class="item-list"></div>

                <div class="add-row">
                    {{ template "ingredient-qty-input" }}
                    {{ template "ingredient-unit-select" }}
                    {{ template "ingredient-name-input" }}
                    <button id="ing-add" type="button" hx-get="/recipes/v1/ingredient-row" hx-include="#ing-qty, #ing-unit, #ing-name" hx-target="#ingredients-list" hx-swap="beforeend" class="btn-secondary">
                        + Add
                    </button>
                </div>
            </div>

            <!-- STEPS -->
            <div class="section-block">
                <div class="section-title">Steps</div>

                <div id="steps-list" class="item-list"></div>

                <div class="step-add-row">

                    <textarea id="step-text" name="step"
                              placeholder="Describe this step..."></textarea>

                    <div class="step-add-bottom">

                        <input type="text"
                               id="step-note"
                               name="note"
                               placeholder="Note (optional)"
                               onkeydown="if(event.key==='Enter'){event.preventDefault();document.getElementById('step-add').click();}">

                        <button id="step-add" type="button"
                                hx-get="/recipes/v1/step-row"
                                hx-include="#step-text, #step-note"
                                hx-target="#steps-list"
                                hx-swap="beforeend"
                                class="btn-secondary">
                            + Add
                        </button>

                    </div>
                </div>
            </div>

        </div>

        <div class="card-footer">
            <button type="submit" class="btn-primary">Submit recipe</button>
        </div>

    </form>
</div>

</body>
</html>
