<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Forgot Password</title>
        <link rel="stylesheet" href="/static/style.css">
    </head>
    <body>
        <header class="navbar">
            <div class="nav-left">
                <div class="logo">Jacob's Grub</div>
            </div>
            <div class="nav-center">
                <form method="GET" action="/" class="search-form">
                    <input type="text" name="query" placeholder="Search recipes..."value="{{.Query}}">
                </form>
            </div>
            <div class="nav-right">
                {{ if .Username }}
                    <span class="welcome">Hello, {{ .Username }}</span>
                    <a href="/recipes/v1/new">Create Recipe</a>
                    <a href="/recipes/v1/myRecipe">My Recipes</a>
                    <a href="/users/v1/logout">Logout</a>
                {{ else }}
                    <a href="/users/v1/login">Login</a>
                    <a href="/users/v1/register">Register</a>
                {{ end }}
            </div>
        </header>
        <div class="auth-page">
            <div class="auth-container">
                <h2>Forgot Password</h2>
                <p>Enter your email to receive a password reset link.</p>
                <form method="post">
                    <input name="email" type="email" placeholder="Email" required>
                    <button type="submit">Send Reset Link</button>
                </form>
            </div>
        </div>
    </body>
</html>
