{{ define "shopping-btn" }}
{{ if .Added }}
<button class="shopping-btn shopping-btn-added" type="button"
        title="Remove from shopping list"
        aria-label="Remove all ingredients from shopping list"
        hx-delete="/shopping-list/v1/remove-recipe?recipe_id={{ .RecipeID }}&render=button"
        hx-target="this"
        hx-swap="outerHTML">
    <img src="/static/icon/grocery-cart-add.png" alt="">
</button>
{{ else }}
<button class="shopping-btn" type="button"
        title="Add all ingredients to shopping list"
        aria-label="Add all ingredients to shopping list"
        hx-post="/shopping-list/v1/add"
        hx-vals='{"recipe_id": "{{ .RecipeID }}"}'
        hx-target="this"
        hx-swap="outerHTML">
    <img src="/static/icon/grocery-cart.png" alt="">
</button>
{{ end }}
{{ end }}
