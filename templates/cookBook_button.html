{{ define "cookbook-btn" }}
{{ if .Bookmarked }}
    <button class="cookbook-btn cookbook-btn-makred" 
            type="button"
            title="Remove from cookbook"
            aria-label="Remove recipe from cookbook"
            hx-delete="/cookbook/v1/remove?recipe_id={{ .RecipeID }}&render=button"
            hx-target="this"
            hx-swap="outerHTML">
        <img src="/static/icon/selected_bookmark.png" alt="">
    </button>
{{ else }}
    <button class="cookbook-btn" 
            type="button"
            title="Add to cookbook"
            aria-label="Add recipe to cookbook"
            hx-post="/cookbook/v1/add"
            hx-vals='{"recipe_id": "{{ .RecipeID }}"}'
            hx-target="this"
            hx-swap="outerHTML">
        <img src="/static/icon/unselected_bookmark.png" alt="">
    </button>
{{ end }}
{{ end }}
