<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Register</title>
        <link rel="stylesheet" href="/static/style.css">
    </head>
    <body>
        <header class="navbar">
            <div class="nav-left">
                <div class="logo">Jacob's Grub</div>
            </div>
            <div class="nav-center">
                <form method="GET" action="/" class="search-form">
                    <input type="text" name="query" placeholder="Search recipes..."value="{{.Query}}">
                </form>
            </div>
            <div class="nav-right">
                {{ if .Username }}
                    <span class="welcome">Hello, {{ .Username }}</span>
                    <a href="/recipes/v1/new">Create Recipe</a>
                    <a href="/recipes/v1/myRecipe">My Recipes</a>
                    <a href="/users/v1/logout">Logout</a>
                {{ else }}
                    <a href="/users/v1/login">Login</a>
                    <a href="/users/v1/register">Register</a>
                {{ end }}
            </div>
        </header>
        <div class="auth-page">
            <div class="auth-container">
                <h2>Register</h2>
                <form method="post" action="/users/v1/register">
                    <label>Username: <input name="username" type="text" placeholder="Username" required></label><br>
                    <label>Email: <input name="email" type="email" placeholder="Email" required></label><br>
                    <label>Password: <input name="password" type="password" placeholder="Password" required></label><br>
                    <label>Confirm Password: <input name="confirm_password" type="password" placeholder="Confirm Password" required></label><br>
                    <button type="submit">Register</button>
                </form>
                <p>
                    Already have an account?
                    <a href="/users/v1/login">Login</a>
                </p>
            </div>
        </div>
    </body>
</html>
