<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Reset Password</title>
        <link rel="stylesheet" href="/static/style.css">
    </head>
    <body class="auth-page">
        <header class="navbar">
            <div class="nav-left">
                <div class="logo">Jacob's Grub</div>
            </div>
            <div class="nav-center">
                <form method="GET" action="/" class="search-form">
                    <input type="text" name="query" placeholder="Search recipes..."value="{{.Query}}">
                </form>
            </div>
            <div class="nav-right">
                {{ if .Username }}
                    <span class="welcome">Hello, {{ .Username }}</span>
                    <a href="/recipes/v1/new">Create Recipe</a>
                    <a href="/recipes/v1/myRecipe">My Recipes</a>
                    <a href="/users/v1/logout">Logout</a>
                {{ else }}
                    <a href="/users/v1/login">Login</a>
                    <a href="/users/v1/register">Register</a>
                {{ end }}
            </div>
        </header>
        <div class="auth-container">
            <h2>Reset Password</h2>
            <form method="POST">
                <input type="hidden" name="token" value="{{.Token}}">
                <label>New Password: <input name="password" type="password" placeholder="New password" required></label><br>
                <label>Confirm New Password: <input name="confirm_password" type="password" placeholder="Confirm new password" required></label><br>
                <button type="submit">Reset Password</button>
            </form>
        </div>
    </body>
</html>
